# Render Blueprint — optional, can also configure manually in dashboard
services:
  - type: web
    name: vista-backend-1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
